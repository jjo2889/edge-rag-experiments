llama_model_path: "models/gemma/gemma-3-270m-it-Q4_K_S.gguf"
onnx_model_path: "models/all-MiniLM-L6-v2-onnx/model.onnx"
tokenizer_json_path: "models/all-MiniLM-L6-v2-onnx/tokenizer.json"

# Raspberry Pi target 기준 기본값: CPU-only
n_gpu_layers: 0
n_ctx: 2048
n_batch: 512
n_threads: 4

# 일부 instruction/chat GGUF에서는 내장 chat template 사용 시 즉시 EOG로 빈 응답이 나올 수 있다.
# 필요할 때만 실험적으로 켠다.
use_model_chat_template: false

# Generation length policy:
# - Supported key: max_new_tokens
# - Unsupported key: max_tokens (startup error)
max_new_tokens: 128
temperature: 0.1
top_k: 40
top_p: 0.95
seed: 42

# repetition_penalty:
# - 1.0 = disabled
# - > 1.0 = penalize repeated tokens in the last N tokens
repetition_penalty: 1.1
repetition_penalty_last_n: 64

# 반복 출력이나 프롬프트 재생산이 시작되면 여기서 자른다.
#
# PromptBuilder는 두 가지 표식을 찍는다: 섹션 헤더는 대괄호로(`[Passages]`),
# 개별 항목 라벨은 대괄호 없이(`Passage 1:`, `Evidence 1:`). 아래 목록은 원래
# 대괄호 형태만 담고 있어서, 모델이 답변 뒤에 `Passage 4:` 하고 컨텍스트 나열을
# 이어가면 아무것도 매칭되지 않아 max_new_tokens까지 폭주했다.
# NQ 25질의 실측: 구조 누수 20%, 상한 도달 24%.
# 항목 라벨 두 줄을 추가해 그 구멍을 메운다 (2026-08-01).
#   NQ  : 구조 누수 20% -> 0%, 상한 24% -> 8%, 생성 평균 2013ms -> 1441ms
#   SciFact: 25건 중 24건 무변화(정상 답변을 자르지 않음), 폭주 1건만 단축
# 매칭에 선행 개행을 요구하므로 문장 중간의 같은 단어는 걸리지 않는다.
stop_strings:
  - "\nPassage "
  - "\nEvidence "
  - "\nI don't know"
  - "\n[Citation"
  - "\n[Explanation"
  - "\n[Context"
  - "\n[Passages"
  - "\n[Evidence"
  - "\n[Question"
  - "\n[Claim"
  - "\n[Answer"
  - "\n[Output"
  - "\n[Explanation"
  - "\n[Note"
  - "\n**"
  - "\n```"
